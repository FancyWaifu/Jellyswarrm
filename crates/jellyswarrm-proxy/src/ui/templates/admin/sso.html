<div id="messages"></div>

<header>
    <h1>SSO / OIDC Providers</h1>
    <h3>Register OpenID Connect identity providers for single sign-on.</h3>
</header>

<section id="add-provider" aria-labelledby="add-provider-heading">
    <h2 id="add-provider-heading" class="section-heading-tight">Add Provider</h2>
    <form hx-post="/{{ ui_route }}/sso/providers" hx-target="#provider-list" hx-swap="innerHTML" hx-disabled-elt="this" hx-on::after-request="if(event.detail.successful) this.reset()">
        <div class="sso-form-grid">
            <label class="form-field"> <span class="field-label">Display name</span>
                <input type="text" name="display_name" placeholder="Authentik" autocomplete="off" required>
            </label>
            <label class="form-field"> <span class="field-label">Slug
                <span class="info-hint" tabindex="0"
                      title="URL-safe id used in the login route /sso/login/&lt;slug&gt;. Re-adding an existing slug updates it."
                      aria-label="Slug help">
                    <i class="fas fa-circle-info" aria-hidden="true"></i>
                </span>
            </span>
                <input type="text" name="slug" placeholder="authentik" pattern="[A-Za-z0-9_-]+" autocomplete="off" required>
            </label>
            <label class="form-field"> <span class="field-label">Issuer URL</span>
                <input type="url" name="issuer_url" placeholder="https://auth.example.com/application/o/jellyswarrm/" inputmode="url" required>
            </label>
            <label class="form-field"> <span class="field-label">Client ID</span>
                <input type="text" name="client_id" autocomplete="off" required>
            </label>
            <label class="form-field"> <span class="field-label">Client Secret</span>
                <input type="password" name="client_secret" autocomplete="off" required>
            </label>
            <label class="form-field"> <span class="field-label">Scopes</span>
                <input type="text" name="scopes" value="openid profile email" autocomplete="off">
            </label>
            <label class="form-field"> <span class="field-label">Server
                <span class="info-hint" tabindex="0"
                      title="Bind this provider to one federated backend so the login picker groups it under that server. Leave as 'All servers' to offer it everywhere."
                      aria-label="Server help">
                    <i class="fas fa-circle-info" aria-hidden="true"></i>
                </span>
            </span>
                <select name="server_id">
                    <option value="">All servers</option>
                    {% for s in servers %}
                    <option value="{{ s.0 }}">{{ s.1 }}</option>
                    {% endfor %}
                </select>
            </label>
            <div class="server-form-submit">
                <span class="field-label field-label-placeholder" aria-hidden="true">Add</span>
                <button type="submit" class="server-form-button">Add Provider</button>
            </div>
        </div>
    </form>
</section>

<hr />

<section id="provider-list" hx-get="/{{ ui_route }}/sso/providers/list" hx-trigger="load">
    <p>Loading providers...</p>
</section>

<hr />

<header>
    <h2 class="section-heading-tight">Linked Identities</h2>
    <h3>Map an SSO identity to an existing Jellyswarrm user (so it inherits their backends). Users can also self-link at login.</h3>
</header>

<section id="add-identity" aria-labelledby="add-identity-heading">
    <form hx-post="/{{ ui_route }}/sso/identities" hx-target="#identity-list" hx-swap="innerHTML" hx-disabled-elt="this" hx-on::after-request="if(event.detail.successful) this.reset()">
        <div class="sso-form-grid">
            <label class="form-field"> <span class="field-label">Jellyswarrm user</span>
                <input type="text" name="username" placeholder="username" autocomplete="off" required>
            </label>
            <label class="form-field"> <span class="field-label">Provider</span>
                <input type="text" name="provider_slug" placeholder="authentik" autocomplete="off" required>
            </label>
            <label class="form-field"> <span class="field-label">Subject
                <span class="info-hint" tabindex="0"
                      title="The OIDC 'sub' claim for the user. They can read it off their link page when they attempt an SSO login."
                      aria-label="Subject help">
                    <i class="fas fa-circle-info" aria-hidden="true"></i>
                </span>
            </span>
                <input type="text" name="subject" placeholder="sub claim" autocomplete="off" required>
            </label>
            <div class="server-form-submit">
                <span class="field-label field-label-placeholder" aria-hidden="true">Link</span>
                <button type="submit" class="server-form-button">Link Identity</button>
            </div>
        </div>
    </form>
</section>

<section id="identity-list" hx-get="/{{ ui_route }}/sso/identities/list" hx-trigger="load">
    <p>Loading identities...</p>
</section>
